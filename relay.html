<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Relay a Split Receipt — Solan × Lumari</title>
<style>:root{--bg:#09090c;--ink:#f4efe4;--dim:#8d8778;--gold:#e8c36a;--card:#13131a;--line:#262633}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:Georgia,serif}.wrap{max-width:720px;margin:0 auto;padding:28px 18px 80px}.kicker{font-family:system-ui;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--gold)}h1{font-size:clamp(28px,6vw,46px);font-weight:500;margin:10px 0}p{color:var(--dim);margin-bottom:8px}label{display:block;font-family:system-ui;font-size:12px;color:var(--dim);margin:12px 0 4px}input{width:100%;background:#0e0e16;color:var(--ink);border:1px solid #2a2a3a;border-radius:10px;padding:10px;font:inherit}button,.btn{display:inline-block;background:var(--gold);color:#111;border:0;text-decoration:none;padding:12px 16px;border-radius:999px;font-family:system-ui;font-weight:700;cursor:pointer;margin:10px 8px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.script{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;color:#d7e4f5}</style>
</head>
<body>
<div class="wrap">
<p class="kicker"><a href="/" style="color:#e8c36a;text-decoration:none">← Desk</a> · public cut only</p>
<h1>Relay the torn receipt.</h1>
<p>A partner gets both verdicts and a dashed license half. You send one link. You do not pitch uniqueness.</p>
<label>Partner handle</label>
<input id="handle" placeholder="cashflow.nchill510"/>
<label>Receipt id</label>
<input id="sid" value="SHX-20260901-PULSE"/>
<button type="button" id="make">Mint relay script</button>
<div class="card"><p class="script" id="script">Fill the handle. We write the message.</p></div>
<a class="btn" id="open" href="/receipt?id=SHX-20260901-PULSE&ref=relay">Open receipt</a>
<a class="btn" href="/affiliate">Dual Witness rules</a>
</div>
<script>
document.getElementById("make").onclick=()=>{
const handle=(document.getElementById("handle").value||"partner").replace(/^@/,"");
const id=document.getElementById("sid").value||"SHX-20260901-PULSE";
const url=location.origin+"/receipt?id="+encodeURIComponent(id)+"&ref="+encodeURIComponent(handle);
document.getElementById("script").textContent="Two seats stamped "+id+". License half is torn on purpose.\n\n"+url+"\n\nIf a stranger can use the file this week, $70 is live. Do not ask about the high-ticket plan.";
document.getElementById("open").href=url;
};
</script>
</body>
</html>
